<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straydom</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            width: 100%;
        }

        /* Lock screen */
        #lock-screen {
            background: rgba(0,0,0,0.3);
            padding: 50px 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }
        #lock-screen h1 { font-size: 3em; margin-bottom: 10px; }
        #lock-screen .lock-icon { font-size: 4em; margin-bottom: 20px; }
        #lock-screen p { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        #passcode-input {
            font-size: 2em;
            padding: 15px 20px;
            width: 200px;
            text-align: center;
            border: none;
            border-radius: 12px;
            letter-spacing: 8px;
            background: rgba(255,255,255,0.95);
            color: #333;
            font-weight: bold;
        }
        #passcode-input:focus { outline: 3px solid #ffeb3b; }
        #submit-btn {
            display: block;
            margin: 20px auto 0;
            padding: 15px 40px;
            font-size: 1.2em;
            background: #ffeb3b;
            color: #333;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s;
        }
        #submit-btn:hover { transform: scale(1.05); }
        #error-msg {
            color: #ff6b6b;
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }

        /* Content (hidden until unlocked) */
        #content { display: none; }
        #content h1 { font-size: 3em; margin-bottom: 10px; }
        #content .tagline { font-size: 1.3em; opacity: 0.9; margin-bottom: 40px; }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .link-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 25px 35px;
            border-radius: 15px;
            color: white;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
            min-width: 250px;
        }
        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
        }
        .link-card h3 { font-size: 1.4em; margin-bottom: 8px; }
        .link-card p { font-size: 0.95em; opacity: 0.9; margin: 0; }
    </style>
</head>
<body>
    <div class="container">

        <div id="lock-screen">
            <div class="lock-icon">🔒</div>
            <h1>Straydom</h1>
            <p>Enter passcode to continue</p>
            <p style="font-size:1em; margin-bottom:20px; opacity:0.85;">🔑 Passcode is <strong>1949</strong></p>
            <input type="password" id="passcode-input" maxlength="4" inputmode="numeric" autofocus>
            <button id="submit-btn" onclick="checkPasscode()">Unlock</button>
            <div id="error-msg"></div>
        </div>

        <div id="content">
            <h1>Straydom</h1>
            <p class="tagline">Welcome!</p>
            <div class="links">
                <a href="https://epg.straydom.com" class="link-card">
                    <h3>📺 EPG Guide</h3>
                    <p>Electronic Program Guide<br>epg.straydom.com</p>
                </a>
            </div>
        </div>

    </div>

    <script>
        const PASSCODE = "1949";

        function checkPasscode() {
            const input = document.getElementById("passcode-input").value;
            const error = document.getElementById("error-msg");
            if (input === PASSCODE) {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("content").style.display = "block";
                sessionStorage.setItem("unlocked", "yes");
            } else {
                error.textContent = "Wrong passcode! Try again.";
                document.getElementById("passcode-input").value = "";
            }
        }

        document.getElementById("passcode-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkPasscode();
        });

        if (sessionStorage.getItem("unlocked") === "yes") {
            document.getElementById("lock-screen").style.display = "none";
            document.getElementById("content").style.display = "block";
        }
    </script>
</body>
</html>
